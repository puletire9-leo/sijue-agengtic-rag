services:
  postgres:
    container_name: supermew-postgres
    image: postgres:15
    environment:
      POSTGRES_DB: langchain_app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "15432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d langchain_app"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    container_name: supermew-redis
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "16379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  etcd:
    container_name: supermew-etcd
    image: quay.io/coreos/etcd:v3.5.18
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - etcd-data:/etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  minio:
    container_name: supermew-minio
    image: minio/minio:RELEASE.2024-05-28T17-19-04Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
      - minio-data:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  standalone:
    container_name: supermew-milvus
    image: milvusdb/milvus:v2.5.14
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      MINIO_REGION: us-east-1
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - milvus-data:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    ports:
      - "19530:19530"
      - "19091:9091"
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy

  app:
    container_name: supermew-app
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "18000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@postgres:5432/langchain_app
      REDIS_URL: redis://redis:6379/0
      MILVUS_HOST: standalone
      MILVUS_PORT: 19530
      EMBEDDING_MODEL: /app/models/bge-m3
      HF_HOME: /app/models
      HF_ENDPOINT: https://hf-mirror.com
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/backend:/app/backend
      - ${MODELS_DIR:-./models}:/app/models
      - ${DOCKER_VOLUME_DIRECTORY:-.}/data:/app/data
    command: uvicorn app:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      standalone:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 90s
    restart: unless-stopped

  open-webui:
    container_name: supermew-open-webui
    build:
      context: ./open-webui-main
      dockerfile: Dockerfile
      args:
        USE_SLIM: "true"
    ports:
      - "13000:8080"
    environment:
      - OPENAI_API_BASE_URLS=http://app:8000/v1
      - OPENAI_API_KEYS=${OPENAI_COMPATIBLE_API_KEY}
      - SUPERMEW_API_KEY=${OPENAI_COMPATIBLE_API_KEY}
      - DEFAULT_MODELS=supermew-rag
      - ENABLE_SIGNUP=true
      - ENABLE_OLLAMA=false
      - WEBUI_URL=http://localhost:13000
      # 关闭 Open WebUI 内置 RAG，所有知识库查询走 SuperMew 后端
      - BYPASS_EMBEDDING_AND_RETRIEVAL=True
      - ENABLE_RETRIEVAL_QUERY_GENERATION=False
      - ENABLE_FORWARD_USER_INFO_HEADERS=true
    volumes:
      - open-webui-data:/app/backend/data
      # 开发模式：挂载整个 routers 和 utils 目录，改任何文件 restart 即可
      - ./open-webui-main/backend/open_webui/routers:/app/backend/open_webui/routers
      - ./open-webui-main/backend/open_webui/utils:/app/backend/open_webui/utils
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

  attu:
    container_name: supermew-attu
    image: zilliz/attu:v2.5.11
    environment:
      - MILVUS_URL=standalone:19530
      - PORT=3000
    ports:
      - "18081:3000"
    depends_on:
      standalone:
        condition: service_healthy
    networks:
      - default

networks:
  default:
    name: supermew-network

volumes:
  open-webui-data:
  postgres-data:
  redis-data:
  etcd-data:
  minio-data:
  milvus-data:
